name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-1234567890
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-1234567890

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        # الاختبارات وحدات نقية ولا تحتاج Supabase. عناوين الـplaceholder أعلاه
        # تبدو صالحة، فالكود يحاول الاتصال بها فعلياً ويعلّق حتى ينتهي المهلة
        # (executePlan ينتظر تسجيل النشاط على الخادم). نفرّغها هنا فيفشل تحقّق
        # البيئة فوراً — نفس ما يحصل على أجهزة المطوّرين حيث المتغيّرات غير مضبوطة.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_SERVICE_ROLE_KEY: ''

      - name: Build
        run: npm run build
